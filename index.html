<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shirt Size Bridge — Levi's & H&M</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen antialiased flex flex-col justify-center items-center p-4">

  <main class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-xl font-bold text-neutral-100 tracking-tight">Shirt Size Bridge</h1>
      <p class="text-xs text-neutral-400">Direct size converter between Levi's & H&M</p>
    </div>

    <!-- Step 1: Source Brand, Size & Fit -->
    <div class="space-y-2">
      <label class="text-xs font-semibold uppercase tracking-wider text-neutral-400">1. A Shirt That Fits You Well</label>
      <div class="grid grid-cols-2 gap-2">
        <!-- Brand -->
        <select id="sourceBrand" onchange="runConversion()" class="bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-neutral-500">
          <option value="levis">Levi's</option>
          <option value="hm">H&M</option>
        </select>

        <!-- Size Tag -->
        <select id="sourceSize" onchange="runConversion()" class="bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-neutral-500">
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M" selected>M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>
      </div>

      <!-- How That Shirt Fits You -->
      <div>
        <select id="sourceFit" onchange="runConversion()" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-neutral-500">
          <option value="slim" selected>Fit: Slim Fit</option>
          <option value="regular">Fit: Regular / Standard</option>
          <option value="relaxed">Fit: Relaxed / Loose</option>
        </select>
      </div>
    </div>

    <!-- Step 2: Target Brand & Fit Preferences -->
    <div class="space-y-2">
      <label class="text-xs font-semibold uppercase tracking-wider text-neutral-400">2. The Shirt You Want to Buy</label>
      <div class="grid grid-cols-2 gap-2">
        <select id="targetBrand" onchange="runConversion()" class="bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-neutral-500">
          <option value="hm">H&M</option>
          <option value="levis">Levi's</option>
        </select>

        <select id="targetFit" onchange="runConversion()" class="bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-neutral-500">
          <option value="regular">Target Fit: Regular</option>
          <option value="slim">Target Fit: Slim</option>
          <option value="relaxed">Target Fit: Relaxed</option>
        </select>
      </div>

      <!-- Height Toggle for H&M Regular vs Long -->
      <div class="pt-1 flex items-center justify-between text-xs text-neutral-400 bg-neutral-950/60 p-2.5 rounded-xl border border-neutral-800/80">
        <span>Your Height:</span>
        <div class="flex gap-2">
          <button type="button" onclick="setHeight('standard')" id="btnHeightStd" class="px-2.5 py-1 rounded-lg bg-neutral-800 text-neutral-100 font-medium transition">Under 6'0"</button>
          <button type="button" onclick="setHeight('tall')" id="btnHeightTall" class="px-2.5 py-1 rounded-lg text-neutral-500 hover:text-neutral-300 font-medium transition">6'0" or Taller</button>
        </div>
      </div>
    </div>

    <!-- Step 3: Result Card with Confidence Gauge -->
    <div class="border-t border-neutral-800/80 pt-5 space-y-3">
      <div class="bg-neutral-950 border border-neutral-800 rounded-xl p-4 text-center space-y-3">
        
        <div>
          <span class="text-[11px] uppercase tracking-wider text-neutral-500 block mb-1">Recommended Target Size</span>
          <div id="outputSize" class="text-4xl font-extrabold text-neutral-100 tracking-tight">--</div>
          <div id="outputNote" class="text-xs text-neutral-400 font-medium mt-1"></div>
        </div>

        <!-- Confidence Badge & Visual Range Indicator -->
        <div class="bg-neutral-900/80 border border-neutral-800/80 rounded-xl p-3 text-left space-y-2">
          <div class="flex items-center justify-between text-xs">
            <span class="text-neutral-400">Fit Confidence:</span>
            <span id="confidenceBadge" class="px-2 py-0.5 rounded-full text-[11px] font-semibold"></span>
          </div>

          <!-- Progress Bar showing position inside size bracket -->
          <div class="relative w-full h-2 bg-neutral-800 rounded-full overflow-hidden">
            <div id="confidenceBar" class="h-full rounded-full transition-all duration-300"></div>
          </div>
          
          <div class="flex justify-between text-[10px] text-neutral-500 font-medium">
            <span>Roomy / Lean</span>
            <span>Optimal Center</span>
            <span>Snug Edge</span>
          </div>
        </div>

      </div>

      <!-- Explanatory Fit Guidance -->
      <p id="fitExplanation" class="text-[12px] leading-relaxed text-neutral-400 bg-neutral-900/50 p-3 rounded-xl border border-neutral-800/60"></p>
    </div>

  </main>

  <script>
    const CHARTS = {
      levis: {
        XS:  { min: 32.0, max: 34.0, mid: 33.0 },
        S:   { min: 35.0, max: 37.0, mid: 36.0 },
        M:   { min: 38.0, max: 40.0, mid: 39.0 },
        L:   { min: 41.0, max: 43.0, mid: 42.0 },
        XL:  { min: 44.0, max: 46.0, mid: 45.0 },
        XXL: { min: 47.0, max: 49.0, mid: 48.0 }
      },
      hm_regular: {
        XS:  { min: 30.75, max: 33.75, mid: 32.25 },
        S:   { min: 33.75, max: 35.5,  mid: 34.6 },
        M:   { min: 37.0,  max: 38.5,  mid: 37.75 },
        L:   { min: 40.25, max: 41.75, mid: 41.0 },
        XL:  { min: 43.25, max: 44.75, mid: 44.0 },
        XXL: { min: 46.5,  max: 48.0,  mid: 47.25 }
      },
      hm_long: {
        XS:  { min: 30.75, max: 33.75, mid: 32.25 },
        S:   { min: 33.75, max: 37.0,  mid: 35.35 },
        M:   { min: 37.0,  max: 40.25, mid: 38.6 },
        L:   { min: 40.25, max: 43.25, mid: 41.75 },
        XL:  { min: 43.25, max: 46.5,  mid: 44.85 },
        XXL: { min: 46.5,  max: 49.5,  mid: 48.0 }
      }
    };

    let isTall = false;

    function setHeight(type) {
      isTall = (type === 'tall');
      const stdBtn = document.getElementById('btnHeightStd');
      const tallBtn = document.getElementById('btnHeightTall');

      if (isTall) {
        tallBtn.className = "px-2.5 py-1 rounded-lg bg-neutral-800 text-neutral-100 font-medium transition";
        stdBtn.className = "px-2.5 py-1 rounded-lg text-neutral-500 hover:text-neutral-300 font-medium transition";
      } else {
        stdBtn.className = "px-2.5 py-1 rounded-lg bg-neutral-800 text-neutral-100 font-medium transition";
        tallBtn.className = "px-2.5 py-1 rounded-lg text-neutral-500 hover:text-neutral-300 font-medium transition";
      }
      runConversion();
    }

    function runConversion() {
      const srcBrand = document.getElementById('sourceBrand').value;
      const srcSize = document.getElementById('sourceSize').value;
      const srcFit = document.getElementById('sourceFit').value;

      let targetBrand = document.getElementById('targetBrand').value;
      const targetFit = document.getElementById('targetFit').value;

      // 1. Pick base chart
      const srcChart = (srcBrand === 'hm' && isTall) ? CHARTS.hm_long : (srcBrand === 'hm' ? CHARTS.hm_regular : CHARTS.levis);
      let estimatedChest = srcChart[srcSize].mid;

      // 2. Adjust for source fit
      if (srcFit === 'slim') {
        estimatedChest -= 0.8;
      } else if (srcFit === 'relaxed') {
        estimatedChest += 0.8;
      }

      // 3. Adjust for target fit
      let requiredChest = estimatedChest;
      if (targetFit === 'slim') {
        requiredChest += 1.0;
      } else if (targetFit === 'relaxed') {
        requiredChest -= 1.0;
      }

      // 4. Select target chart
      let isLongCut = false;
      let targetChartKey = targetBrand;
      if (targetBrand === 'hm') {
        if (isTall) {
          targetChartKey = 'hm_long';
          isLongCut = true;
        } else {
          targetChartKey = 'hm_regular';
        }
      }
      const targetChart = CHARTS[targetChartKey];

      // 5. Match closest size
      let bestSize = 'M';
      let minDiff = 999;
      for (const [size, data] of Object.entries(targetChart)) {
        if (requiredChest >= data.min && requiredChest <= data.max) {
          bestSize = size;
          break;
        }
        const diff = Math.abs(requiredChest - data.mid);
        if (diff < minDiff) {
          minDiff = diff;
          bestSize = size;
        }
      }

      // 6. Calculate Confidence & Position inside the recommended bracket
      const targetData = targetChart[bestSize];
      const rangeSpan = targetData.max - targetData.min;
      let positionRatio = (requiredChest - targetData.min) / rangeSpan;
      positionRatio = Math.max(0.05, Math.min(0.95, positionRatio)); // Clamp to 5% - 95%

      const badge = document.getElementById('confidenceBadge');
      const bar = document.getElementById('confidenceBar');
      let statusNote = '';

      bar.style.width = `${(positionRatio * 100).toFixed(0)}%`;

      if (positionRatio >= 0.35 && positionRatio <= 0.75) {
        badge.textContent = 'Ideal Sweet Spot';
        badge.className = 'px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800';
        bar.className = 'h-full rounded-full transition-all duration-300 bg-emerald-500';
        statusNote = 'You sit directly in the optimal chest range for this cut.';
      } else if (positionRatio > 0.75) {
        badge.textContent = 'Borderline Snug';
        badge.className = 'px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-950 text-amber-400 border border-amber-800';
        bar.className = 'h-full rounded-full transition-all duration-300 bg-amber-500';
        statusNote = 'You are at the upper edge. If you prefer breathing room or have broad shoulders, consider sizing up.';
      } else {
        badge.textContent = 'Lean Fit (Roomy)';
        badge.className = 'px-2 py-0.5 rounded-full text-[11px] font-semibold bg-blue-950 text-blue-400 border border-blue-800';
        bar.className = 'h-full rounded-full transition-all duration-300 bg-blue-500';
        statusNote = 'You are on the leaner end of this size; expect a slightly more relaxed drape.';
      }

      // 7. Update UI
      const displaySize = isLongCut ? `${bestSize}/L (Long)` : bestSize;
      document.getElementById('outputSize').textContent = displaySize;

      const brandName = targetBrand === 'hm' ? 'H&M' : "Levi's";
      document.getElementById('outputNote').textContent = `In ${brandName} • ${targetFit.charAt(0).toUpperCase() + targetFit.slice(1)} Fit`;

      let explanation = `Your current shirt (${srcBrand === 'hm' ? 'H&M' : "Levi's"} ${srcSize}, ${srcFit}) corresponds to roughly ${estimatedChest.toFixed(1)}" body chest. Target recommendation: ${displaySize}. ${statusNote}`;
      
      if (isLongCut) {
        explanation += ` Tall cut selected: includes +1" sleeve length and longer hem drop.`;
      }

      document.getElementById('fitExplanation').textContent = explanation;
    }

    // Run on startup
    runConversion();
  </script>
</body>
</html>
